services:
  postgres:
    image: postgres:16-alpine
    container_name: worknoon-refund-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refund_system
    ports:
      - "5432:5432"
    volumes:
      - refund_postgres_data:/var/lib/postgresql/data

volumes:
  refund_postgres_data:
